<meta charset="utf-8">
<title>Живые картины</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&display=swap">
<link rel="stylesheet" href="./gallery.css">
<script type="module" src="./viewer.mjs"></script>
  <header class="masthead">
    <a href="#ispolin" class="wordmark"><span class="mark" aria-hidden="true">◈</span> Галерея существ</a>
    <nav aria-label="Разделы галереи"><a href="#ours">Наши</a><a href="#bosses">Боссы</a><a href="#pets">Питомцы</a><a href="#archive">Архив</a></nav>
  </header>
  <main>
    <header class="title"><h1>Живые картины</h1></header>
    <section id="ispolin" class="feature" aria-labelledby="feature-title">
      <div class="wall">
        <button type="button" class="painting feature-painting" data-id="meadow_colossus"
                aria-label="Поиграть с Луговым исполином" aria-describedby="gestures"
                aria-busy="true"><canvas width="180" height="148">Луговой исполин</canvas></button>
      </div>
      <div class="feature-text">
        <span class="rarity">Необычная картина</span>
        <h2 id="feature-title">Луговой исполин</h2>
        <p class="live"><span aria-hidden="true"></span><output id="mood">Загрузка картины…</output></p>
        <p id="gestures"><span id="touch-hint">Одно касание — радость, два — трюк.</span> <span class="keyboard-hint">С клавиатуры используйте Enter и клавишу 2.</span></p>
        <div class="actions">
          <button type="button" id="leave" disabled>Уйти</button>
          <button type="button" id="skill" disabled>Показать приём</button>
          <button type="button" id="change-form" hidden disabled>Сменить облик</button>
        </div>
        <p id="presence" role="status" aria-live="polite"></p>
      </div>
      <div class="playback">
        <div id="variants" class="variants" role="group" aria-label="Облик" hidden></div>
        <div id="battle-controls" hidden>
          <div class="stage-controls">
            <label for="stage">Стадия боя</label>
            <select id="stage">
              <option value="1">I · Тесак и крышка</option>
              <option value="2">II · Стража</option>
              <option value="3">III · Узел лопнул</option>
              <option value="4">IV · Смена оружия</option>
            </select>
            <button type="button" id="next-stage">Следующая стадия</button>
          </div>
          <div class="direction-controls">
            <span id="directions-label">Сторона клипа</span>
            <div id="directions" role="group" aria-labelledby="directions-label"></div>
          </div>
        </div>
        <h3 id="clips-title">Анимации</h3>
        <div id="clips" class="clip-list" role="group" aria-labelledby="clips-title"></div>
      </div>
    </section>
    <div id="collection"></div>
  </main>
  <noscript>Для анимации картин включите JavaScript.</noscript>
