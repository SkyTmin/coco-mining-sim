name: Проверить и упаковать панораму Хранителя
on:
  push:
    branches: [keeper-panorama-check-c3d61260]
    paths: [.github/workflows/keeper-panorama.yml]
permissions:
  contents: read
defaults:
  run:
    working-directory: tools/creatures
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: bafa53f038a44f5a8f493460966743bcdadd574d, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24.22.1 }
      - run: npm ci --no-audit --no-fund
      - name: Gate all paintings
        run: |
          set -o pipefail
          npm run -s ws -- gate all --jobs 4 | tee "$RUNNER_TEMP/gate-all.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keeper-panorama-gate
          path: ${{ runner.temp }}/gate-all.log
          retention-days: 5
  golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: bafa53f038a44f5a8f493460966743bcdadd574d, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.14.0 }
      - run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/keeper-snapshot"
          npm run -s ws -- snap threshold_keeper --force --jobs 3
          npm run -s ws -- snap threshold_keeper --check --force --jobs 3 | tee "$RUNNER_TEMP/keeper-snapshot/check.log"
          cp golden/threshold_keeper.json .studio/snap-threshold_keeper.json "$RUNNER_TEMP/keeper-snapshot/"
      - uses: actions/upload-artifact@v4
        with:
          name: keeper-panorama-golden
          path: ${{ runner.temp }}/keeper-snapshot/
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: bafa53f038a44f5a8f493460966743bcdadd574d, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24.22.1 }
      - name: Render native artwork
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --import tsx render.ts --id threshold_keeper --anim idle --scale 1
          python3 - <<'PY'
          from pathlib import Path
          import concurrent.futures,subprocess,json
          meta=json.loads(Path('../../assets/creatures/threshold_keeper/meta.json').read_text())
          def render(n):
              subprocess.run(['node','--import','tsx','render.ts','--id','threshold_keeper','--anim',n,'--scale','1'],check=True)
          names=sorted((n for n in meta['animations'] if n!='idle'),key=lambda n:-meta['animations'][n]['frames'])
          with concurrent.futures.ThreadPoolExecutor(3) as pool: list(pool.map(render,names))
          PY
      - name: Attach the source and compare every exported GIF frame
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keeper-verify"
          python3 release.py "$RUNNER_TEMP/keeper-panorama.zip" --ids threshold_keeper
          test "$(gh api repos/SkyTmin/coco-mining-sim/releases/460162185 --jq .draft)" = true
          gh release download creatures-threshold-keeper-v2 --pattern hundred-landings-original.png --dir "$RUNNER_TEMP"
          gh release upload creatures-threshold-keeper-panorama --clobber "$RUNNER_TEMP/keeper-panorama.zip" "$RUNNER_TEMP/hundred-landings-original.png"
          cd ../../assets/creatures/threshold_keeper
          sha256sum gif/*.gif > "$RUNNER_TEMP/keeper-verify/gifs.sha256"
          cd ../../../tools/creatures
          npm run -s verify -- --all-frames threshold_keeper | tee "$RUNNER_TEMP/keeper-verify/verify.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keeper-panorama-export
          path: ${{ runner.temp }}/keeper-verify/

