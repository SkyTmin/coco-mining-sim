name: Attach the reviewed creature pilot
on:
  push:
    branches: [bosses-art]
    paths: [.github/workflows/creatures-pilot-2.yml]

permissions:
  contents: read

jobs:
  attach:
    if: >-
      github.event.head_commit.message == 'ci(creatures): приложить проверенный архив ко второму пилоту'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0397ba029d97c096868355694b51cfe2b348e9f5
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Render the reviewed paintings and all animation layers
        working-directory: tools/creatures
        run: |
          set -euo pipefail
          npm ci
          for id in bramble_warden coin_dragon crater_titan frost_yeti gem_beetle silk_dragon toad_shaman; do
            node --import tsx render.ts --id "$id"
          done
      - name: Verify the ZIP and the contents of every file against the reviewed export
        run: |
          set -euo pipefail
          python3 tools/creatures/release.py "$RUNNER_TEMP/creatures-pilot-2.zip"
          python3 - "$RUNNER_TEMP/creatures-pilot-2.zip" <<'PY'
          import hashlib, sys, zipfile
          digest = hashlib.sha256()
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for name in sorted(archive.namelist()):
                  digest.update(name.encode() + b'\0' + hashlib.sha256(archive.read(name)).digest())
          if digest.hexdigest() != '729fd270822dcb832cb02a71c687812d8d63c619b63ccab796743a7dd9464910':
              sys.exit('The generated contents differ from the reviewed export.')
          PY
      - name: Attach the verified ZIP to the existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          draft_id=449566274
          endpoint="repos/$GITHUB_REPOSITORY/releases/$draft_id"
          upload_url=$(gh api "$endpoint" --jq 'select(.draft and .tag_name == "creatures-pilot-2" and .target_commitish == "0397ba029d97c096868355694b51cfe2b348e9f5").upload_url | split("{")[0]')
          test "$upload_url" = "https://uploads.github.com/$endpoint/assets"
          curl --silent --show-error --fail-with-body --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Content-Type: application/zip" \
            --data-binary "@$RUNNER_TEMP/creatures-pilot-2.zip" \
            "$upload_url?name=creatures-pilot-2.zip" | jq -e '{id, state, size, digest} | select(.state == "uploaded")'
