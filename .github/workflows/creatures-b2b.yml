name: Attach the reviewed B2b paintings
'on':
  push:
    branches:
    - bosses-art
    paths:
    - .github/workflows/creatures-b2b.yml
permissions:
  contents: read
concurrency:
  group: attach-creatures-b2b
  cancel-in-progress: false
jobs:
  attach:
    if: 'github.repository == ''SkyTmin/coco-mining-sim'' && github.event.head_commit.message == ''ci(creatures):
      приложить проверенные картины Б2б'''
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ae6e2d14c9c13362936cc2df9466d23b0771dd9c
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Load reviewed checksums and limited release tooling
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/delivery.py" <<'B2B_DELIVERY_SCRIPT'
        """Prepare immutable reviewed assets, a one-use Actions workflow, and audit a GitHub download."""
        import argparse
        import filecmp
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import shutil
        import subprocess
        import sys
        import tempfile
        import time
        import zipfile
        import urllib.request

        TAG = "creatures-b2b"
        REPO = "SkyTmin/coco-mining-sim"
        IDS = ("frost_yeti", "toad_shaman")
        MOVES = {"frost_yeti": ("tech_snowball", "tech_slam"), "toad_shaman": ("tech_staff", "tech_leap")}
        ZIP = TAG + ".zip"
        GALLERY = {f"{actor}-{move}.gif": f"assets/creatures/{actor}/gif/painting-{move}.gif"
                   for actor in IDS for move in ("showreel", *MOVES[actor])}
        SOURCE = Path("/workspace/bosses-art")
        SCRIPT = Path(__file__).resolve()
        WORKFLOW = ".github/workflows/creatures-b2b.yml"
        TITLE = "ci(creatures): приложить проверенные картины Б2б"


        def die(message):
            raise SystemExit(message)


        def validate_sha(sha):
            if not re.fullmatch(r"[0-9a-f]{40}", sha):
                die("Expected a full lowercase commit SHA.")
            return sha


        def checksum(path):
            with path.open("rb") as f:
                return {"size": path.stat().st_size, "sha256": hashlib.file_digest(f, "sha256").hexdigest()}


        def inspect_zip(path):
            with zipfile.ZipFile(path) as archive:
                names = archive.namelist()
                if len(names) != len(set(names)) or not names:
                    die("Empty ZIP or duplicate members.")
                expected = set(IDS) | {"frames"}
                if any(not n.startswith("assets/creatures/") for n in names):
                    die("ZIP contains unrelated files.")
                if {n.split("/")[2] for n in names} != expected:
                    die("Unexpected ZIP root inventory.")
                rarities = set()
                for actor in IDS:
                    sub = f"assets/creatures/{actor}/"
                    meta = json.loads(archive.read(sub + "meta.json"))
                    if meta["id"] != actor:
                        die(f"Incorrect identity in {sub}meta.json.")
                    rarities.add(meta["rarity"])
                    for move, spec in meta["animations"].items():
                        must = [f"gif/painting-{move}.gif", f"frames/{move}/motion.json"]
                        for layer in ("body", "lit", "fxu", "fxo"):
                            must.extend(f"frames/{move}/{layer}/{frame:03}.png" for frame in range(spec["frames"]))
                        for name in must:
                            archive.getinfo(sub + name)
                if {n.split("/")[3] for n in names if n.startswith("assets/creatures/frames/")} != rarities:
                    die("ZIP frame rarity inventory does not match the actors.")
                digest = hashlib.sha256()
                for name in sorted(names):
                    with archive.open(name) as f:
                        content = hashlib.file_digest(f, "sha256").digest()
                    digest.update(name.encode() + b"\0" + content)
                return {"members": len(names), "entries_sha256": digest.hexdigest(), "rarities": sorted(rarities)}


        def pack(source, dest, sha, verify=True):
            if (source / ".git").exists():
                checkout = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=source, text=True).strip()
                if checkout != validate_sha(sha):
                    die("The checked-out source revision differs from the reviewed revision.")
            dest.mkdir(exist_ok=True, parents=True)
            if verify:
                run(["node", "--import", "tsx", "verify.ts", "--all-frames", *IDS], source / "tools/creatures")
            run([sys.executable, "tools/creatures/release.py", str(dest / ZIP), "--ids", *IDS], source)
            for name, relative in GALLERY.items():
                shutil.copyfile(source / relative, dest / name)
            manifest = {"repository": REPO, "tag": TAG, "sha": validate_sha(sha),
                        "files": {n: checksum(dest / n) for n in (ZIP, *GALLERY)},
                        "archive": inspect_zip(dest / ZIP)}
            (dest / "manifest.json").write_text(json.dumps(manifest, sort_keys=True, indent=2) + "\n")
            return manifest


        def run(cmd, cwd):
            start = time.monotonic()
            print("+", *cmd, flush=True)
            subprocess.run(cmd, cwd=cwd, check=True)
            print(f"{time.monotonic() - start:.1f}s elapsed", flush=True)


        def render(sha, dest, source):
            validate_sha(sha)
            dest.mkdir(parents=True, exist_ok=True)
            with tempfile.TemporaryDirectory(prefix="export-", dir=dest) as temp:
                tree = Path(temp)
                tar = subprocess.Popen(["git", "archive", "--format=tar", sha], cwd=source, stdout=subprocess.PIPE)
                subprocess.run(["tar", "xf", "-", "-C", temp], stdin=tar.stdout, check=True)
                tar.stdout.close()
                if tar.wait():
                    die("git archive failed.")
                workshop = tree / "tools/creatures"
                modules = source / "tools/creatures/node_modules"
                if (workshop / "package-lock.json").read_bytes() == (source / "tools/creatures/package-lock.json").read_bytes() and modules.is_dir():
                    (workshop / "node_modules").symlink_to(modules, target_is_directory=True)
                else:
                    run(["npm", "ci", "--no-audit", "--no-fund"], workshop)
                for actor in IDS:
                    run(["node", "--import", "tsx", "render.ts", "--id", actor], workshop)
                print(json.dumps(pack(tree, dest, sha), indent=2))


        def validate_manifest(dest, sha):
            m = json.loads((dest / "manifest.json").read_text())
            if (m["sha"], m["tag"], m["repository"]) != (validate_sha(sha), TAG, REPO):
                die("Manifest belongs to another revision, tag or repository.")
            if set(m["files"]) != {ZIP, *GALLERY}:
                die("Manifest does not enumerate exactly seven delivery files.")
            for name, expected in m["files"].items():
                if checksum(dest / name) != expected:
                    die(f"Local bytes differ from the reviewed manifest for {name}.")
            if inspect_zip(dest / ZIP) != m["archive"]:
                die("ZIP inventory or member contents differ.")
            return m


        def remote_bytes(draft_id, sha, dest, state, do_upload=False):
            if not isinstance(draft_id, int) or draft_id < 1:
                die("Expected a positive release ID.")
            m = validate_manifest(dest, sha)
            api = f"repos/{REPO}/releases/{draft_id}"
            def gh(path):
                url = path + ("&" if "?" in path else "?") + "b2b_fresh=" + str(time.time_ns())
                return json.loads(subprocess.check_output(["gh", "api", url]))
            upload_url = f"https://uploads.github.com/{api}/assets"
            def release():
                r = gh(api)
                if r["id"] != draft_id or r["draft"] != (state == "draft") or r["tag_name"] != TAG or r["target_commitish"] != sha or r["upload_url"].split("{")[0] != upload_url:
                    die("Unexpected release identity, revision or publication status.")
            def inventory():
                entries = gh(api + "/assets?per_page=100")
                assets = {a["name"]: a for a in entries}
                if len(assets) != len(entries) or not assets.keys() <= m["files"].keys():
                    die("Unexpected or duplicate remote assets.")
                for name, a in assets.items():
                    e = m["files"][name]
                    if a["state"] != "uploaded" or a["size"] != e["size"] or a["digest"] != "sha256:" + e["sha256"]:
                        die(f"Remote size, state or digest differs for {name}.")
                return assets
            release()
            assets = inventory()
            if do_upload:
                if state != "draft":
                    die("Only drafts accept uploads.")
                for name in sorted(m["files"].keys() - assets.keys()):
                    release()
                    mime = "image/gif" if name.endswith(".gif") else "application/zip"
                    # Upload from a verified file. The authorization header is passed on stdin, outside argv and logs.
                    token = os.environ["GH_TOKEN"]
                    config = f'header = "Authorization: Bearer {token}"\n'
                    subprocess.run(["curl","--config","-","--silent","--show-error","--fail","--request","POST",
                                    "--header","Content-Type: "+mime,"--data-binary","@"+str(dest/name),
                                    upload_url+"?name="+name],input=config,text=True,stdout=subprocess.DEVNULL,check=True)
                assets = inventory()
            if assets.keys() != m["files"].keys():
                die("Remote release has missing assets.")
            with tempfile.TemporaryDirectory(prefix="read-back-",dir=dest) as tmp:
                for name, a in assets.items():
                    target = Path(tmp) / name
                    with target.open("wb") as stream:
                        if state == "published":
                            expected_url = f"https://github.com/{REPO}/releases/download/{TAG}/{name}"
                            if a["browser_download_url"] != expected_url:
                                die(f"Unexpected public URL for {name}.")
                            req = urllib.request.Request(expected_url,headers={"User-Agent":"b2b-release-verification"})
                            with urllib.request.urlopen(req,timeout=240) as response:
                                if response.status != 200:
                                    die(f"Public download failed for {name}.")
                                shutil.copyfileobj(response,stream,1024*1024)
                        else:
                            subprocess.run(["gh","api",f"repos/{REPO}/releases/assets/{a['id']}?b2b_readback={time.time_ns()}","-H","Accept: application/octet-stream"],stdout=stream,check=True)
                    if checksum(target) != m["files"][name] or not filecmp.cmp(target, dest/name, shallow=False):
                        die(f"Downloaded bytes differ for {name}.")
                    print(f"{name}: downloaded {a['size']} bytes; SHA-256 and byte comparison passed.",flush=True)
            release()


        if __name__ == "__main__":
            parser = argparse.ArgumentParser()
            parser.add_argument("command", choices=("pack", "attach"))
            parser.add_argument("--sha", required=True)
            parser.add_argument("--dest", type=Path, required=True)
            parser.add_argument("--source", type=Path)
            parser.add_argument("--draft-id", type=int)
            args = parser.parse_args()
            if args.command == "pack":
                pack(args.source, args.dest, args.sha)
            else:
                remote_bytes(args.draft_id, args.sha, args.dest, "draft", True)

        B2B_DELIVERY_SCRIPT
        mkdir -p "$RUNNER_TEMP/b2b-reviewed"
        cat > "$RUNNER_TEMP/b2b-reviewed/expected.json" <<'B2B_MANIFEST'
        {
          "archive": {
            "entries_sha256": "62a1cc4c8088720dfb00533427e7f2609068243cd60ee5e42f490461550b2cb0",
            "members": 13548,
            "rarities": [
              "epic",
              "legendary"
            ]
          },
          "files": {
            "creatures-b2b.zip": {
              "sha256": "b15a72857d7e33e9c60a19f13a7fc29f20c517c762cde5b23750816aece4586f",
              "size": 95814797
            },
            "frost_yeti-showreel.gif": {
              "sha256": "db03a0b58f3fb005acbbf12f4a3b730b8df3874ee657585898d6dda8dce337df",
              "size": 4717772
            },
            "frost_yeti-tech_slam.gif": {
              "sha256": "8b403fb9a4783f55dc9e8740ae60614ac15b0d68f158c8d2232a20bf8cfc07f1",
              "size": 952701
            },
            "frost_yeti-tech_snowball.gif": {
              "sha256": "8c946bfb6d65b553bd8d7eb3c91b39243843a9732d1bd34d2b11bc40e99edafa",
              "size": 1511982
            },
            "toad_shaman-showreel.gif": {
              "sha256": "2a0746cedb51fcb54563c4d943e80d90462019ab0d7435806083627ffbb905f1",
              "size": 6834765
            },
            "toad_shaman-tech_leap.gif": {
              "sha256": "f2ba9590f2396eabe2d6aaf80a0631d654f5939053fac824de299b055378f565",
              "size": 1774565
            },
            "toad_shaman-tech_staff.gif": {
              "sha256": "dc8919360455e1855eab4537e11de15b63bb89536ebb4ba2c6c09db19a412a99",
              "size": 1388539
            }
          },
          "repository": "SkyTmin/coco-mining-sim",
          "sha": "ae6e2d14c9c13362936cc2df9466d23b0771dd9c",
          "tag": "creatures-b2b"
        }
        B2B_MANIFEST
    - name: Render only frost_yeti and toad_shaman
      working-directory: tools/creatures
      run: |-
        set -euo pipefail
        npm ci --no-audit --no-fund
        for id in frost_yeti toad_shaman; do
          node --import tsx render.ts --id "$id"
        done
    - name: Check all frames, inventory, raw ZIP and every GIF byte digest
      run: |-
        set -euo pipefail
        python3 "$RUNNER_TEMP/delivery.py" pack --sha ae6e2d14c9c13362936cc2df9466d23b0771dd9c --source "$GITHUB_WORKSPACE" --dest "$RUNNER_TEMP/b2b-reviewed"
        cmp "$RUNNER_TEMP/b2b-reviewed/manifest.json" "$RUNNER_TEMP/b2b-reviewed/expected.json"
    - name: Attach seven verified assets to the existing draft and read them back
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        set -euo pipefail
        python3 "$RUNNER_TEMP/delivery.py" attach --sha ae6e2d14c9c13362936cc2df9466d23b0771dd9c --draft-id 450125362 --dest "$RUNNER_TEMP/b2b-reviewed"
