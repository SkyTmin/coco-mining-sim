<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Улучшения: вкладки слева</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.k{font-family:'Nunito',sans-serif;font-weight:900;color:#1E2140}
.rail{font-family:'Nunito',sans-serif;font-weight:900;color:#1E2140;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:120px;height:96px;border:4px solid #1E2140;border-radius:22px;box-shadow:0 5px 0 #1E2140;cursor:pointer;text-decoration:none;font-size:17px;position:relative;transition:transform 100ms}
.rail:active{transform:translateY(5px);box-shadow:none}
.btn{font-family:'Nunito',sans-serif;font-weight:900;border:4px solid #1E2140;border-radius:16px;box-shadow:0 5px 0 #1E2140;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(5px);box-shadow:none}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.bump{animation:pop 260ms ease-out}
a{color:#1E2140}a:hover{color:#1E2140}
</style>
</helmet>
<div class="k" style="width:1280px;height:720px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#3A3352,#0E0C16)">
  <div style="position:absolute;left:44px;top:64px;width:1192px;height:620px;box-sizing:border-box;background:#FFF8EC;border:5px solid #1E2140;border-radius:32px;box-shadow:0 10px 0 #1E2140;padding:44px 24px 24px;display:flex;gap:22px">
    <div style="position:absolute;left:34px;top:-34px;transform:rotate(-2deg);background:#A855F7;color:#fff;border:5px solid #1E2140;border-radius:20px;box-shadow:0 6px 0 #1E2140;padding:8px 28px;font-size:34px;text-shadow:0 3px 0 #1E2140">Улучшения</div>
    <a href="Main.dc.html" aria-label="Закрыть" style="position:absolute;right:-26px;top:-26px;width:72px;height:72px;border-radius:50%;background:#FF4D5E;border:5px solid #1E2140;box-shadow:0 6px 0 #1E2140;display:flex;align-items:center;justify-content:center;text-decoration:none">
      <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="#fff" stroke-width="4.5" stroke-linecap="round"></path></svg>
    </a>

    <div style="display:flex;flex-direction:column;gap:12px;flex:none">
      <button class="rail" onClick="{{tabPick}}" style="background:{{bgPick}}">
        <svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true"><path d="M7 15c8-8 22-9 32-2l-3 3c-8-5-18-5-25 1z" fill="#C8B6FF" stroke="#1E2140" stroke-width="3.5" stroke-linejoin="round"></path><path d="M21 13l4 4-15 22-4-4z" fill="#B0703C" stroke="#1E2140" stroke-width="3.5" stroke-linejoin="round"></path></svg>Кирка
      </button>
      <button class="rail" onClick="{{tabCards}}" style="background:{{bgCards}}">
        <svg width="44" height="44" viewBox="0 0 52 48" aria-hidden="true"><rect x="6" y="10" width="22" height="30" rx="4" fill="#FFF8EC" stroke="#1E2140" stroke-width="3.5" transform="rotate(-12 17 25)"></rect><rect x="22" y="8" width="22" height="30" rx="4" fill="#EC4899" stroke="#1E2140" stroke-width="3.5" transform="rotate(10 33 23)"></rect></svg>Карточки
        <span style="position:absolute;right:-8px;top:-8px;width:28px;height:28px;border-radius:50%;background:#FF4D5E;border:3px solid #1E2140;color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center">3</span>
      </button>
      <a href="Pickaxes.dc.html" class="rail" style="background:#FFF8EC">
        <svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true"><path d="M5 17c9-10 27-10 38 0l-4 3c-8-6-21-7-30 0z" fill="#8BE1FF" stroke="#1E2140" stroke-width="3.5" stroke-linejoin="round"></path><path d="M22 13h5v31h-5z" fill="#B0703C" stroke="#1E2140" stroke-width="3.5" transform="rotate(35 24 28)"></path></svg>Кирки
      </a>
      <a href="Family.dc.html" class="rail" style="background:#FFF8EC">
        <svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3l18 10.5v21L24 45 6 34.5v-21z" fill="#1A78D6" stroke="#1E2140" stroke-width="3.5" stroke-linejoin="round"></path><path d="M21 12h9l-4 9h6l-11 15 3-11h-5z" fill="#FFE14D" stroke="#1E2140" stroke-width="2.5" stroke-linejoin="round"></path></svg>Семья
      </a>
      <a href="Chest.dc.html" class="rail" style="background:#FFF8EC">
        <svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true"><path d="M6 22h36v18H6z" fill="#3A4AA8" stroke="#1E2140" stroke-width="3.5"></path><path d="M6 22c0-10 36-10 36 0z" fill="#5B6CD0" stroke="#1E2140" stroke-width="3.5"></path><path d="M14 13v27M34 13v27" stroke="#FFC83D" stroke-width="5"></path></svg>Сундук
      </a>
    </div>

    <sc-if value="{{showCards}}" hint-placeholder-val="{{ true }}">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:12px">
        <div style="font-size:24px">На этот круг <span style="font-size:17px;font-weight:800;opacity:.7">· сгорают при перерождении</span></div>
        <div style="flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px">
          <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
            <div style="display:flex;flex-direction:column;align-items:center;gap:8px;background:#FFF8EC;border:4px solid #1E2140;border-radius:24px;box-shadow:0 6px 0 #1E2140;padding:14px 12px;position:relative;overflow:hidden">
              <div style="position:absolute;left:0;right:0;top:0;height:120px;background:{{c.bg}};border-bottom:4px solid #1E2140"></div>
              <span class="{{c.bump}}" style="position:relative;margin-top:8px;width:96px;height:96px;border-radius:50%;background:#FFF8EC;border:4px solid #1E2140;display:flex;align-items:center;justify-content:center">
                <svg width="60" height="60" viewBox="0 0 48 48" aria-hidden="true"><path d="{{c.icon}}" fill="{{c.fill}}" stroke="#1E2140" stroke-width="3.5" stroke-linejoin="round"></path></svg>
              </span>
              <div style="font-size:26px;margin-top:6px">{{c.name}}</div>
              <div style="font-size:16px;font-weight:800;opacity:.75;text-align:center;min-height:40px">{{c.hint}}</div>
              <div style="font-size:16px;font-weight:800">ур. {{c.level}}</div>
              <div style="width:100%;box-sizing:border-box;background:#F2E6D2;border:3px solid #1E2140;border-radius:14px;padding:6px;text-align:center;font-size:19px">{{c.now}} <span style="color:#16A34A">→ {{c.next}}</span></div>
              <button class="btn" onClick="{{c.buy}}" style="width:100%;height:58px;margin-top:auto;background:#FFC83D;color:#1E2140;font-size:21px">
                <svg width="26" height="26" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="19" fill="#FFC83D" stroke="#1E2140" stroke-width="5"></circle></svg>{{c.price}}
              </button>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{showPick}}" hint-placeholder-val="{{ false }}">
      <div style="flex:1;min-width:0;display:flex;gap:20px;align-items:stretch">
        <div style="flex:1;background:radial-gradient(circle,#D7F3FF 0%,#F2E6D2 65%);border:4px solid #1E2140;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
          <svg width="230" height="230" viewBox="0 0 48 48" aria-hidden="true"><path d="M5 17c9-10 27-10 38 0l-4 3c-8-6-21-7-30 0z" fill="#45CFFF" stroke="#1E2140" stroke-width="2.4" stroke-linejoin="round"></path><path d="M22 13h5v31h-5z" fill="#B0703C" stroke="#1E2140" stroke-width="2.4" transform="rotate(35 24 28)"></path><circle cx="24" cy="15" r="4" fill="#FFE14D" stroke="#1E2140" stroke-width="2"></circle></svg>
          <div style="font-size:32px">Гроза ★</div>
        </div>
        <div style="width:380px;display:flex;flex-direction:column;gap:14px">
          <div style="background:#F2E6D2;border:4px solid #1E2140;border-radius:20px;padding:14px;text-align:center"><div style="font-size:18px;opacity:.7">Уровень кирки</div><div class="{{pickBump}}" style="font-size:54px">{{pickLevel}} <span style="font-size:24px;opacity:.6">из 10</span></div></div>
          <div style="background:#F2E6D2;border:4px solid #1E2140;border-radius:20px;padding:14px;text-align:center;font-size:26px">Сила {{pickPow}} <span style="color:#16A34A">→ {{pickNext}}</span></div>
          <button class="btn" onClick="{{buyPick}}" style="margin-top:auto;height:76px;background:#FFC83D;color:#1E2140;font-size:28px">
            <svg width="34" height="34" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="19" fill="#FFC83D" stroke="#1E2140" stroke-width="5"></circle></svg>Улучшить · {{pickPrice}}
          </button>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'cards', lv: [4, 2, 1, 0], pick: 3, bumped: -1 }; }
  renderVals() {
    const st = this.state;
    const DEF = [
      { name: 'Сила', hint: 'каждый удар сильнее', bg: '#FF8A65', fill: '#FFB38A', icon: 'M14 20c0-6 4-8 8-8h8c4 0 6 3 6 7v9c0 8-5 14-13 14s-11-5-11-11z', per: 10, unit: '%' },
      { name: 'Монеты', hint: 'больше монет за блок', bg: '#FFC83D', fill: '#FFE27A', icon: 'M24 6a18 18 0 1 0 .01 0z', per: 8, unit: '%' },
      { name: 'Крит', hint: 'шанс двойного удара', bg: '#FF4FA3', fill: '#FFE14D', icon: 'M24 4l5 14h15l-12 9 5 15-13-9-13 9 5-15-12-9h15z', per: 1, unit: '%' },
      { name: 'Ключи', hint: 'ключи копятся быстрее', bg: '#3D8BFF', fill: '#FFC83D', icon: 'M6 24a9 9 0 1 1 18 0 9 9 0 0 1-18 0zM24 21h18v6h-4v6h-5v-6h-9z', per: 5, unit: '%' },
    ];
    const prices = ['120', '250', '520', '1 100', '2 300', '4 800', '10 000'];
    const cards = DEF.map((d, i) => ({
      ...d, level: st.lv[i], now: '+' + d.per * st.lv[i] + ' ' + d.unit, next: '+' + d.per * (st.lv[i] + 1) + ' ' + d.unit,
      price: prices[Math.min(st.lv[i], prices.length - 1)], bump: st.bumped === i ? 'bump' : '',
      buy: () => { this.setState({ lv: st.lv.map((v, k) => (k === i ? v + 1 : v)), bumped: i }); setTimeout(() => this.setState({ bumped: -1 }), 280); },
    }));
    const pow = (l) => (2 + l * 0.4).toFixed(1).replace('.', ',');
    return {
      cards, showCards: st.tab === 'cards', showPick: st.tab === 'pick',
      bgCards: st.tab === 'cards' ? '#FFC83D' : '#FFF8EC', bgPick: st.tab === 'pick' ? '#FFC83D' : '#FFF8EC',
      tabCards: () => this.setState({ tab: 'cards' }), tabPick: () => this.setState({ tab: 'pick' }),
      pickLevel: st.pick, pickPow: pow(st.pick), pickNext: pow(st.pick + 1), pickPrice: ['500', '1 200', '2 600', '5 400', '11 000', '23 000', '48 000', '99 000', '210 000', '450 000'][Math.min(st.pick, 9)],
      pickBump: st.bumped === 9 ? 'bump' : '',
      buyPick: () => { if (st.pick >= 10) return; this.setState({ pick: st.pick + 1, bumped: 9 }); setTimeout(() => this.setState({ bumped: -1 }), 280); },
    };
  }
}
</script>
</body>
</html>
